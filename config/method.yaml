# How every analysis is computed, in words, published in each catalog's item
# properties (design §5). Edit the wording freely: it changes metadata only.
# Changing what the pipeline does needs code, tests and a PIPELINE_VERSION bump.

# fire:scene_selection
scene_selection: >-
  Every scene in each window; where a provider lists one Sentinel-2 acquisition
  (mission, sensing start, orbit, tile) under several processings, only the
  newest processing baseline

# fire:scaling
scaling: >-
  Per scene: reflectance = DN * scale + offset, with the scene's own published
  raster:bands scale and offset (else the product's documented rule), before
  compositing

# sci:publications: the papers behind each index. DOIs checked against Crossref.
publications:
  - citation: >-
      Key, C.H., Benson, N.C. (2006). Landscape Assessment (LA): Sampling and
      analysis methods. In: Lutes, D.C., et al., FIREMON: Fire Effects Monitoring
      and Inventory System. Gen. Tech. Rep. RMRS-GTR-164-CD. USDA Forest Service,
      Rocky Mountain Research Station. LA-1-55. (dNBR)
    doi: "10.2737/RMRS-GTR-164"
  - citation: >-
      Miller, J.D., Thode, A.E. (2007). Quantifying burn severity in a
      heterogeneous landscape with a relative version of the delta Normalized
      Burn Ratio (dNBR). Remote Sensing of Environment 109, 66-80. (RdNBR)
    doi: "10.1016/j.rse.2006.12.006"
  - citation: >-
      Parks, S.A., Dillon, G.K., Miller, C. (2014). A New Metric for Quantifying
      Burn Severity: The Relativized Burn Ratio. Remote Sensing 6(3), 1827-1844.
      (RBR)
    doi: "10.3390/rs6031827"
