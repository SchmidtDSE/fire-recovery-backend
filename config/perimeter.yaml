# Wording for a submitted perimeter's collection (geometry_kind "perimeter"),
# in its analysis's catalog: the collection's title and description, and what
# its .portolan/metadata.yaml says in place of the catalog's providers,
# keywords and notes. Metadata only: edit freely.
#
# {fire_event_name} is the request's name, verbatim.

title: "{fire_event_name} perimeter"

description: >-
  The fire perimeter submitted with this burn severity analysis of
  {fire_event_name}, as the requester supplied it. It was not checked against
  an official perimeter. Coordinates are rounded to a millionth of a degree;
  nothing else was changed. The analysis covers a buffered box around it.

# Portolan requires a producer (rashid PTL-PRV-001), and a producer other than
# the host makes the collection a mirror, which must link its upstream source
# (PTL-PRO-001). An uploaded file has no upstream, so we are the producer of
# this dataset; the description says the geometry is the requester's.
providers:
  - name: "Schmidt Center for Data Science & Environment, UC Berkeley"
    roles: ["producer", "processor", "host"]
    url: "https://dse.berkeley.edu"

keywords: ["fire perimeter", "wildfire", "burn severity"]

processing_notes: >-
  Source: the perimeter submitted with the analysis request. Z dropped and
  coordinates rounded to integer micro-degrees (about 0.11 m); rings kept as
  submitted. Converted to GeoParquet; vector tiles generated by portolan with
  tippecanoe.

# The GeoParquet's columns.
columns:
  fire_id: >-
    The analysis this perimeter was submitted with: its catalog and collection id.
  fire_event_name: >-
    The fire event name the analysis was requested under.
  geometry: >-
    The perimeter, a MultiPolygon in longitude and latitude (EPSG:4326).
  bbox: >-
    The perimeter's bounding box, for spatial filtering (GeoParquet 1.1 covering).
