# josh's GKE Autopilot cluster (project dse-nps, us-west1), as the josh repo
# dispatches to it. SEVERITY_TARGET=gke-josh selects this profile.
namespace: fire-severity-dev
# Env var holding a kubeconfig for a ServiceAccount allowed to create, get,
# list and delete Jobs and to read pods in the namespace (deployment/k8s/).
kubeconfig_env: K8S_KUBECONFIG_GKE_JOSH
# The namespace Secret with the storage and SMTP credentials.
secret_name: severity-v2
# Spot pods, as josh runs: a preemption is a DisruptionTarget, which the Job
# reschedules without counting it as a failure.
node_selector:
  cloud.google.com/gke-spot: "true"
tolerations: []
# Bounded memory peaks around 0.5 GiB (design §2); 2 GiB leaves headroom for
# portolan and GDAL. Autopilot bills requests and sets limits equal to them.
resources:
  requests: {cpu: "2", memory: 2Gi, ephemeral-storage: 10Gi}
  limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 10Gi}
threads: 2
scratch_size: 10Gi
active_deadline_seconds: 21600
ttl_seconds_after_finished: 86400
