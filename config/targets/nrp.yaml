# NRP Nautilus. SEVERITY_TARGET=nrp selects this profile. NRP requires limits
# within 20% of requests and penalizes unused requests, so they are equal and
# sized to the bounded pipeline. Jobs have no runtime cap there; only bare
# pods are removed after 6 h.
namespace: fire-severity-dev
kubeconfig_env: K8S_KUBECONFIG_NRP
secret_name: severity-v2
node_selector: {}
tolerations: []
resources:
  requests: {cpu: "2", memory: 2Gi, ephemeral-storage: 10Gi}
  limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 10Gi}
threads: 2
scratch_size: 10Gi
active_deadline_seconds: 21600
ttl_seconds_after_finished: 86400
