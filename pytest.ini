[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    network: reads real STAC APIs and imagery; deselected by default, run with -m network
addopts = -m "not network"
env_files =
    .devcontainer/test.env
    .devcontainer/.env
