name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  # Every base branch, so each PR in a stack gets checks. The jobs that use
  # secrets (publish-schema, deploy) run only on push to dev or main.
  pull_request:

# A new push to a PR cancels that PR's checks still running. Pushes to dev and
# main always run to the end (their deploys queue, see the deploy job).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Type checking (runs in parallel, no secrets)
  mypy:
    name: MyPy Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.45.0  # matches deployment/fastapi.Dockerfile
          cache: true

      - name: Run mypy
        run: pixi run mypy --config-file mypy.ini src/

  # Job 2: Linting and formatting (runs in parallel, no secrets)
  ruff:
    name: Ruff Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.45.0  # matches deployment/fastapi.Dockerfile
          cache: true

      - name: Run ruff check
        run: pixi run ruff-check

      - name: Run ruff format check
        run: pixi run ruff-format --check

  # Job 3: Tests including contract tests (runs in parallel, no secrets)
  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    # RustFS, the S3-compatible store for CI and local development (MinIO's
    # community image is deprecated). The storage tests push a catalog to it.
    services:
      rustfs:
        image: rustfs/rustfs:1.0.4
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key

    env:
      S3_ENDPOINT: localhost:9000
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_SECURE: "False"
      S3_BUCKET: test-bucket
      S3_REGION: us-east-1
      RUN_STORAGE_TESTS: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.45.0  # matches deployment/fastapi.Dockerfile
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Wait for RustFS and create the test bucket
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://$S3_ENDPOINT/"; then
              echo "RustFS is answering"
              break
            fi
            echo "Waiting for RustFS... (attempt $i/30)"
            sleep 2
          done
          aws --endpoint-url "http://$S3_ENDPOINT" s3 mb "s3://$S3_BUCKET"

      - name: Run all tests (including contract and storage tests)
        run: pixi run pytest --verbose

      - name: Generate baseline schema for artifact
        if: always()
        run: pixi run python -m scripts.generate_baseline_schema

      - name: Upload baseline schema as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: openapi-schema
          path: tests/contract/baseline_schema.json
          retention-days: 1  # Short retention, will be uploaded to GCP

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-results
          path: |
            .pytest_cache/
            **/*.log
          retention-days: 7

  # Job 4: Build the image, so a Dockerfile or lock problem shows up on the PR
  # rather than at deploy time. A PR from this repository also pushes it to
  # GHCR by commit, as josh publishes joshsim-batch, so a cluster can run the
  # branch before it merges (deployment/k8s/README.md).
  image:
    name: Build Image
    runs-on: ubuntu-latest
    # A healthy build takes minutes; a stuck one shouldn't hold a runner for hours.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The PR's own commit, not the merge, so the tag names what's in it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build deployment/fastapi.Dockerfile
        run: |
          docker build --file deployment/fastapi.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag fire-recovery-backend:ci .

      # Jobs run with egress limited to DNS, HTTPS and SMTP, and the Kind test
      # leaves that policy out, so check here that the catalog step's DuckDB
      # extension loads with no network at all.
      - name: Check the image loads DuckDB spatial offline
        run: |
          docker run --rm --network none fire-recovery-backend:ci \
            python -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL spatial'); c.execute('LOAD spatial')"

      - name: Push this PR's image to GHCR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGE: ghcr.io/schmidtdse/fire-recovery-backend/severity-batch
          SHA: ${{ github.event.pull_request.head.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag fire-recovery-backend:ci "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"

  # Job 5: Publish OpenAPI schema to GCP (needs all quality checks to pass)
  # SECURITY: Only runs on dev/main branches, uses environment-scoped secrets
  publish-schema:
    name: Publish OpenAPI Schema
    runs-on: ubuntu-latest
    needs: [mypy, ruff, pytest, image]  # Waits for ALL quality checks to succeed
    # Only run on push to dev/main (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    # SECURITY: This job uses environment-scoped secrets (GCP_SA_KEY)
    # PRs cannot access this job due to the if condition above
    environment:
      name: ${{ github.ref_name }}  # 'dev' or 'main' environment

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download schema artifact from pytest job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openapi-schema

      - name: Verify schema file exists
        run: |
          if [ ! -f baseline_schema.json ]; then
            echo "Schema file not found!"
            exit 1
          fi
          echo "Schema file found ($(wc -c < baseline_schema.json) bytes)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: dse-nps

      - name: Rename schema copies to their published object names
        run: |
          cp baseline_schema.json "${{ github.sha }}.json"
          cp baseline_schema.json "${{ github.ref_name }}.json"

      - name: Upload commit-specific schema to GCP
        uses: google-github-actions/upload-cloud-storage@c0f6160ff80057923ff50e5e567695cea181ec23 # v2
        with:
          path: ${{ github.sha }}.json
          destination: fire-recovery-store/openapi-schemas
          parent: false
          process_gcloudignore: false
          headers: |-
            content-type: application/json

      - name: Upload branch-specific schema to GCP
        uses: google-github-actions/upload-cloud-storage@c0f6160ff80057923ff50e5e567695cea181ec23 # v2
        with:
          path: ${{ github.ref_name }}.json
          destination: fire-recovery-store/openapi-schemas
          parent: false
          process_gcloudignore: false
          headers: |-
            content-type: application/json

      - name: Display schema URLs
        run: |
          echo "OpenAPI schema published:"
          echo "  Commit: https://storage.googleapis.com/fire-recovery-store/openapi-schemas/${{ github.sha }}.json"
          echo "  Branch: https://storage.googleapis.com/fire-recovery-store/openapi-schemas/${{ github.ref_name }}.json"

  # Job 6: Deploy to Cloud Run (needs schema publish to succeed)
  # SECURITY: Only runs on dev/main branches, uses environment-scoped secrets
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [publish-schema]  # Waits for schema publishing to succeed
    # One deploy per branch at a time, in push order: a later push waits rather
    # than racing an earlier one for the same image tag.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    # Only run on push to dev/main (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    # SECURITY: This job uses environment-scoped secrets (GCP_SA_KEY)
    # The 'main' environment should require manual approval
    environment:
      name: ${{ github.ref_name }}  # 'dev' or 'main' environment
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write
      packages: write  # push the image to GHCR, where the clusters pull it

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: dse-nps

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: dse-nps

      - name: Verify authentication
        run: gcloud auth list

      - name: Set environment variable for branch
        run: echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      # One build, pushed to GHCR (the analysis Jobs pull it from any cluster)
      # and to Artifact Registry (Cloud Run pulls it). Both carry the same
      # digest, and the API starts Jobs with it, so the code that derived a job
      # id is the code that runs it.
      - name: Build the image once and push it to GHCR and Artifact Registry
        id: image
        if: github.ref_name == 'dev'
        env:
          # Named and tagged as josh's joshsim-batch: {sha} and latest.
          GHCR_IMAGE: ghcr.io/schmidtdse/fire-recovery-backend/severity-batch
          AR_IMAGE: us-central1-docker.pkg.dev/dse-nps/fire-recovery-backend/dev
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          # A BuildKit builder exports the image once and pushes that same
          # manifest to every tag.
          docker buildx create --use --name severity-builder
          docker buildx build \
            --file deployment/fastapi.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag "$GHCR_IMAGE:$GITHUB_SHA" --tag "$GHCR_IMAGE:latest" \
            --tag "$AR_IMAGE:$GITHUB_SHA" --tag "$AR_IMAGE:latest" \
            --provenance=false \
            --push .
          ghcr_digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          ar_digest=$(docker buildx imagetools inspect "$AR_IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          if [ -z "$ghcr_digest" ] || [ "$ghcr_digest" != "$ar_digest" ]; then
            echo "Digests differ or are missing: GHCR '$ghcr_digest', Artifact Registry '$ar_digest'"
            exit 1
          fi
          echo "Pushed $ghcr_digest to both registries"
          echo "digest=$ghcr_digest" >> "$GITHUB_OUTPUT"

      - name: Build and Deploy to Cloud Run
        id: deploy
        run: |
          if [ "${{ env.BRANCH_NAME }}" = "main" ]; then
            echo "Deploying to PRODUCTION..."

            gcloud builds submit \
              --config deployment/prod-cloudbuild.yml \
              --service-account="projects/dse-nps/serviceAccounts/github-actions-sa@dse-nps.iam.gserviceaccount.com" \
              .

            # Prod runs as its own account (fire-recovery-iac, environments/prod),
            # which needs secretAccessor on the two storage-key secrets. The code
            # reads the keys on every analysis, from the same secrets as dev's
            # service. This deploy owns the revision, including its runtime account.
            # The size and CPU allocation match dev's live service: analyses run as
            # background tasks after the response, so CPU must stay allocated between
            # requests, and live prod throttles it.
            gcloud run deploy fire-recovery-backend-prod \
              --image us-central1-docker.pkg.dev/dse-nps/fire-recovery-backend/prod:latest \
              --platform managed \
              --service-account=fire-recovery-backend-prod-sa@dse-nps.iam.gserviceaccount.com \
              --region us-central1 \
              --cpu 8 \
              --memory 32Gi \
              --no-cpu-throttling \
              --min-instances 1 \
              --max-instances 1 \
              --allow-unauthenticated \
              --update-secrets "S3_ACCESS_KEY_ID=fire-recovery-backend-minio-key:latest,S3_SECRET_ACCESS_KEY=fire-recovery-backend-minio-secret:latest" \
              --tag "sha-${GITHUB_SHA:0:7}"

            # Ensure 100% traffic goes to the new revision
            gcloud run services update-traffic fire-recovery-backend-prod \
              --region us-central1 \
              --to-latest

            echo "url=https://fire-recovery-backend-prod-<hash>-uc.a.run.app" >> $GITHUB_OUTPUT
          fi

          if [ "${{ env.BRANCH_NAME }}" = "dev" ]; then
            echo "Deploying to DEV..."
            DIGEST="${{ steps.image.outputs.digest }}"
            DEV_URL="https://fire-recovery-backend-dev-113009620257.us-central1.run.app"

            # Env vars and secrets are merged into the service's. The service
            # runs as its own account, which reaches josh's cluster with no key
            # (a RoleBinding in the namespace). v2 uses its own bucket and HMAC
            # key, which the API passes on to each Job. The account and secrets
            # come from fire-recovery-iac (environments/fire-severity-k8s/), and
            # the API key secret needs a version (deployment/k8s/README.md §5).
            # This deploy owns the revision, including its runtime account.
            gcloud run deploy fire-recovery-backend-dev \
              --image "us-central1-docker.pkg.dev/dse-nps/fire-recovery-backend/dev@$DIGEST" \
              --platform managed \
              --service-account=fire-severity-k8s-api-sa@dse-nps.iam.gserviceaccount.com \
              --region us-central1 \
              --min-instances 1 \
              --max-instances 1 \
              --allow-unauthenticated \
              --tag "sha-${GITHUB_SHA:0:7}" \
              --update-env-vars "SEVERITY_IMAGE=ghcr.io/schmidtdse/fire-recovery-backend/severity-batch@$DIGEST,GIT_SHA=$GITHUB_SHA,SEVERITY_TARGET=gke-josh,SEVERITY_API_URL=$DEV_URL,S3_BUCKET=dse-nps-fire-severity-storage" \
              --update-secrets "SEVERITY_API_KEY_HASHES=severity-v2-api-key-hashes:latest,S3_ACCESS_KEY_ID=fire-severity-k8s-minio-access-key:latest,S3_SECRET_ACCESS_KEY=fire-severity-k8s-minio-secret-key:latest"

            # Ensure 100% traffic goes to the new revision
            gcloud run services update-traffic fire-recovery-backend-dev \
              --region us-central1 \
              --to-latest

            echo "url=$DEV_URL" >> $GITHUB_OUTPUT
          fi

      - name: Display deployment URL
        run: |
          echo "Deployment complete:"
          echo "  URL: ${{ steps.deploy.outputs.url }}"
