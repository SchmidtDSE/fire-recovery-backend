# The credentials every analysis Job reads (envFrom). Copy, fill in, apply,
# and never commit the filled-in copy:
#   kubectl apply -f severity-v2-secret.yaml
# Storage uses S3 with HMAC keys on every cluster (design §7). SMTP is
# optional: without SMTP_USER the job sends no mail and still runs.
apiVersion: v1
kind: Secret
metadata:
  name: severity-v2
  namespace: fire-severity-dev
type: Opaque
stringData:
  S3_ENDPOINT: storage.googleapis.com
  S3_SECURE: "True"
  S3_BUCKET: fire-recovery-store
  S3_ACCESS_KEY_ID: "<GCS HMAC access key>"
  S3_SECRET_ACCESS_KEY: "<GCS HMAC secret>"
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "465"
  SMTP_USER: "<the sending Gmail address>"
  SMTP_PASSWORD: "<its app password>"
  OPERATOR_EMAIL: "<who gets failure tracebacks>"
